name: devoo_radio
description: Devoo Radio Pro - radio di tutto il mondo su una mappa, con registrazione.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.1.0
  latlong2: ^0.9.1
  just_audio: ^0.10.0
  just_audio_background: any
  http: ^1.2.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  share_plus: ^10.1.4
  google_mobile_ads: any

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
