name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Genera i file Android mancanti (gradle...) senza toccare i nostri
      - name: Prepara progetto Android
        run: |
          flutter create --platforms=android --org com.designer1974 --project-name devoo_radio .
          rm -f test/widget_test.dart

      - name: Dipendenze
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter pub get > out.txt 2>&1 || { report out.txt "because|depends|incompatible|version solving" PubGet; exit 1; }
          grep -E "flutter_map|just_audio|latlong" pubspec.lock -A3 | grep -E "^  [a-z]|version" || true

      - name: Controllo codice
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter analyze --no-fatal-infos --no-fatal-warnings > out.txt 2>&1 || { report out.txt "error •" Analyze; exit 1; }

      - name: Test
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter test > out.txt 2>&1 || { report out.txt "Expected|Actual|Error|error|FAILED|\\.dart:[0-9]+" Test; exit 1; }

      # Solo informazione: i server delle radio e delle mappe rispondono?
      - name: Controllo server
        continue-on-error: true
        run: |
          for h in de1 de2 fi1 nl1 at1 all; do
            curl -s --compressed -m 60 -A DevooRadio/1.0 -o r.json -w "$h %{http_code} %{size_download}B %{time_total}s  " "https://$h.api.radio-browser.info/json/stations/search?has_geo_info=true&hidebroken=true&order=clickcount&reverse=true&limit=1000" || true
            python3 -c "import json;d=json.load(open('r.json'));print(len(d),'stazioni, con posizione:',sum(1 for x in d if x.get('geo_lat')))" 2>/dev/null || echo "-"
          done
          curl -s -m 30 -A DevooRadio/1.0 "https://de1.api.radio-browser.info/json/stations/search?countrycode=MA&hidebroken=true&limit=500" | python3 -c "import json,sys;d=json.load(sys.stdin);print('Marocco:',len(d))" || true
          curl -s -m 30 -A DevooRadio/1.0 "https://de1.api.radio-browser.info/json/stations/search?state=Rabat&hidebroken=true" | python3 -c "import json,sys;d=json.load(sys.stdin);print('Rabat:',[x['name'] for x in d][:10])" || true
          curl -s -m 30 -A DevooRadio/1.0 "https://de1.api.radio-browser.info/json/countries?hidebroken=true" | python3 -c "import json,sys;d=json.load(sys.stdin);print('Paesi:',len(d), d[:2])" || true
          for u in World_Imagery/MapServer/tile/3/3/4 Reference/World_Boundaries_and_Places/MapServer/tile/3/3/4 Canvas/World_Dark_Gray_Base/MapServer/tile/3/3/4 Canvas/World_Dark_Gray_Reference/MapServer/tile/3/3/4; do
            echo "$u $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' -m 30 https://server.arcgisonline.com/ArcGIS/rest/services/$u)"
          done

      # Firma sempre uguale: ogni nuova versione si installa SOPRA la vecchia
      - name: Chiave di firma fissa
        run: |
          mkdir -p ~/.android
          cp .github/test-signing.keystore ~/.android/debug.keystore

      - name: Compila APK
        run: |
          report() { msg=$(grep -E "$2" "$1" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); [ -z "$msg" ] && msg=$(tail -40 "$1" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'); echo "::error title=$3::$msg"; }
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm > out.txt 2>&1 || { grep -A25 "What went wrong" out.txt > err.txt || true; grep -E "^e: |error:" out.txt | head -20 >> err.txt || true; report err.txt "." Build; exit 1; }
          tail -5 out.txt

      - name: Rinomina APK
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk DevooRadio.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk DevooRadio-telefoni-vecchi.apk
          ls -la *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DevooRadio
          path: '*.apk'

      # Pubblica l'APK nella pagina "Releases" per scaricarlo dal telefono
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Devoo Radio build ${{ github.run_number }}
          files: |
            DevooRadio.apk
            DevooRadio-telefoni-vecchi.apk
          make_latest: true
